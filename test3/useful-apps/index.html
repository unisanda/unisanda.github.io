<!DOCTYPE html>
<html lang="en" data-theme="maroon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="apps.doc">Useful Apps — Unisanda</title>
<meta name="description" content="Hand-picked PC apps and tools, each with a short note and a link to its official site.">
<meta name="theme-color" content="#5a2530">
<link rel="icon" type="image/png" href="../../favicon.png.png">

<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="useful.css">
<script>
  // Apply the saved background colour and language before first paint.
  try {
    var t = localStorage.getItem('uni-theme');
    if (t === 'paper' || t === 'maroon') document.documentElement.dataset.theme = t;
    if (localStorage.getItem('uni-lang') === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
    }
  } catch (e) {}
</script>
</head>

<main class="apps">

  <div id="sections"></div>

  <p class="apps-note" data-i18n="apps.note">Every link goes to the app's official site or project page. Always download from there.</p>

<script src="../i18n.js"></script>

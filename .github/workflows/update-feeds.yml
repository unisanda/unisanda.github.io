name: Update game feeds

# Refreshes test3/upcoming-games/steam.json (popular Steam games this month)
# and test3/free-games/live.json (limited-time free games from GamerPower,
# plus FreeStuff when a FREESTUFF_API_KEY repository secret is set) and
# test3/accounts/profiles.json (X profiles for the accounts page).

on:
  schedule:
    - cron: '23 * * * *'   # every hour
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest data
        env:
          FREESTUFF_API_KEY: ${{ secrets.FREESTUFF_API_KEY }}
        run: node scripts/update-feeds.mjs

      - name: Commit changes
        id: commit
        run: |
          git add test3/upcoming-games/steam.json test3/free-games/live.json test3/accounts/profiles.json test3/accounts/tiktok.json test3/accounts/avatars test3/upcoming-games-2/steam.json
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update game feeds"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token may not start a Pages build on
      # their own, so ask for one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will publish on the next push."
